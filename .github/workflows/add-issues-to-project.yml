name: Add Issues to Project

on:
  workflow_call:
    inputs:
      project_url:
        description: GitHub Project URL that receives new issues.
        required: true
        type: string
    secrets:
      project_token:
        description: Token with permission to add issues to the GitHub Project.
        required: true

permissions:
  issues: read

jobs:
  add-to-project:
    name: Add issue to GitHub Project
    runs-on: ubuntu-latest
    steps:
      - name: Validate project automation config
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.project_token }}
          ADD_TO_PROJECT_URL: ${{ inputs.project_url }}
        run: |
          if [ -z "$ADD_TO_PROJECT_URL" ]; then
            echo "::error::Set repository variable ADD_TO_PROJECT_URL to the GitHub Project URL, for example https://github.com/users/LukaszRemkowicz/projects/1"
            exit 1
          fi

          if [ -z "$ADD_TO_PROJECT_PAT" ]; then
            echo "::error::Set repository secret ADD_TO_PROJECT_PAT with GitHub Project write access."
            exit 1
          fi

      - name: Add issue to project
        uses: actions/add-to-project@v2
        with:
          project-url: ${{ inputs.project_url }}
          github-token: ${{ secrets.project_token }}
